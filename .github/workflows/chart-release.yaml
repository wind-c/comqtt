name: chart-release

on:
  push:
    branches:
      - main
    paths:
      - "deploy/helm/**"
  # Manual re-run is the only way to recover when publishing half-succeeds:
  # the push that already triggered this workflow has been consumed, and
  # with skip_existing it is now safe to run again. Needed whenever the
  # gh-pages branch or the chart release exists but the index was never
  # updated.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  release:
    name: Release Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Ensure gh-pages branch exists
        run: |
          # Capture the starting branch first: `git checkout --orphan` leaves no
          # previous branch, so a later `git checkout -` fails with
          # "pathspec '-' did not match any file(s) known to git" and kills the
          # job before chart-releaser ever runs.
          start_branch="$(git rev-parse --abbrev-ref HEAD)"
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git rm -rf --quiet .
            # chart-releaser parses this file as a Helm repo index and aborts
            # with "no API version specified" if it is not well-formed, so seed
            # a valid empty index rather than a bare `{}`.
            printf 'apiVersion: v1\nentries: {}\ngenerated: "1970-01-01T00:00:00Z"\n' > index.yaml
            git add index.yaml
            git commit -m "Initialize gh-pages"
            git push origin gh-pages
          fi
          git checkout "$start_branch"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: deploy/helm
          # Without this, any re-run aborts with
          # "tag_name already_exists" because chart-releaser unconditionally
          # creates a release per chart version. Makes the workflow idempotent.
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: |
          CHART_VERSION=$(helm show chart deploy/helm/comqtt | grep '^version:' | awk '{print $2}')
          helm package deploy/helm/comqtt --destination /tmp
          helm push /tmp/comqtt-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
